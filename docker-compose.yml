version: '3.8'

services:
  # 1. Authoritative Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: mmorpg-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mmorpg_db
    ports:
      - "18543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmorpg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. High-Speed State Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: mmorpg-redis
    restart: always
    ports:
      - "18637:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API Microservice (GORM, HTTP Configs, Map & Assets Editor)
  api-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmorpg-api-service
    restart: always
    environment:
      SERVICE_TYPE: "api"
      API_PORT: "8081"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: mmorpg_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: super_secret_jwt_key_mmorpg_123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Game Microservice (30Hz Authoritative ECS Sync Loop & WS/KCP Gateways)
  game-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmorpg-game-service
    restart: always
    ports:
      - "18088:8080"
      - "9999:9999/udp"
    environment:
      SERVICE_TYPE: "game"
      PORT: "8080"
      KCP_PORT: "9999"
      API_SERVICE_URL: "http://api-service:8081"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: mmorpg_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: super_secret_jwt_key_mmorpg_123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-service:
        condition: service_started

  # 5. Interactive Web Client (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Bakes dynamic public API/WS URLs into Next.js client bundle during build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:18088}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:18088/ws}
    container_name: mmorpg-frontend
    restart: always
    ports:
      - "18033:3000"
    depends_on:
      - game-service

volumes:
  pgdata:
  redisdata:
