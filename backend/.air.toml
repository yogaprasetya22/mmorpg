# .air.toml
# Config file for [Air](https://github.com/air-verse/air) in MMORPG Backend

# Working directory
root = "."
tmp_dir = "tmp"

[build]
  # Just plain old go build command
  cmd = "go build -o ./tmp/main cmd/server/main.go"
  # Binary file yields from `cmd`
  bin = "./tmp/main"
  # Customize binary execution with env variables if needed
  full_bin = "./tmp/main"
  # Watch these filename extensions
  include_ext = ["go", "tpl", "html", "toml", "env"]
  # Ignore these directories
  exclude_dir = ["assets-model", "build", "tmp", "vendor"]
  # Watch these directories if you want (empty means all)
  include_dir = []
  # Exclude files
  exclude_file = []
  # Exclude specific regular expressions
  exclude_regex = ["_test.go"]
  # Exclude unchanged files
  exclude_unchanged = false
  # Follow symlink
  follow_symlink = false
  # This log file places in your tmp_dir
  log = "build-errors.log"
  # Poll files instead of using fsnotify (useful for VM/containers)
  poll = false
  poll_interval = 0
  # Delay after trigger build (ms)
  delay = 1000
  # Stop running old binary if build fails
  stop_on_error = true
  # Send Interrupt signal instead of Kill (graceful shutdown)
  send_interrupt = true
  # Kill delay
  kill_delay = "500ms"

[color]
  app = ""
  build = "yellow"
  main = "cyan"
  runner = "green"
  watcher = "magenta"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
